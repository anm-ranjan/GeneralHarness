api:
  # Native is selectable when enabled and a host credential or environment override is present.
  enabled: true
  base_url: https://openrouter.ai/api/v1
  # Legacy fallback. Fresh installs use ~/.myharness/credentials.enc.
  api_key: ""
  timeout_seconds: 120
  streaming: true          # stream assistant tokens live in the web UI
  # OpenRouter only: one provider slug or an ordered list. Requests are limited
  # to these providers and try list entries in order. Ignored for other hosts.
  # provider: together
  # provider: [together, deepinfra, fireworks]

models:
  default: qwen/qwen3-coder-next
  read:    qwen/qwen3-coder-next
  write:   qwen/qwen3-coder-next
  summary: qwen/qwen3-coder-next

permissions:
  # always_ask: ask before file_write, file_replace, apply_patch, and shell_run
  # shell_only: ask only before shell_run
  # auto_approve: do not ask before risky tools
  approval_mode: always_ask
  # Absolute directories the agent may read and write. The setup installer fills
  # this in; an empty list falls back to the current working directory.
  allowed_paths: []

memory:
  context_limit_tokens: 200000
  compact_threshold_tokens: 50000
  keep_recent_messages: 8
  tool_compress_threshold_chars: 500

limits:
  max_file_size: 8000000
  max_tool_output: 10000

search:
  max_results: 100
  rg_path: ""

gather:
  # Max concurrent workers for one gather_context tool call. Clamped to 1..32.
  # The effective count is also bounded by the number of jobs in the batch.
  max_workers: 8

python:
  # Absolute Python interpreter recommended for shell_run python calls.
  # Leave empty to use the interpreter running the backend.
  # Windows example: C:\Users\you\IPA\.venv\Scripts\python.exe
  interpreter: ""

agent:
  # Preferred provider for new threads. If unavailable, the UI asks for one.
  default_provider: native
  max_iterations: 20
  tool_call_checkpoint: 20

shell:
  default_timeout: 120
  # Limits for shell_run(background=true) jobs (dev servers, watch tasks).
  max_background_jobs: 10
  background_output_max_lines: 2000

server:
  # Bind address for the FastAPI backend. 0.0.0.0 makes it available on the LAN.
  # The API has no built-in authentication, so use only on a trusted LAN.
  # MYHARNESS_WEB_HOST / MYHARNESS_WEB_PORT override these.
  host: 127.0.0.1
  port: 8420

# Other machines running the app that the web UI can switch between. Each host
# owns its own projects, labels, and threads — switching swaps the whole
# tree, nothing is merged across machines.
#
# Keep `hosts` identical on every machine and change only `self`, so there is
# one fleet definition to maintain. The browser connects to each `url`
# directly, so point them at SSH tunnels and leave every backend on 127.0.0.1:
#
#   ssh -N -L 8421:127.0.0.1:8420 jarvis.local
#
fleet:
  enabled: false
  # Which entry in `hosts` is this machine. MYHARNESS_FLEET_SELF overrides.
  self: ""
  # How often the UI re-checks the other hosts for reachability and for runs
  # waiting on an approval.
  poll_seconds: 10
  # Every machine in the fleet, this one included. For example:
  #
  #   hosts:
  #     - id: mac                    # stable and unique; renaming it resets
  #       label: MacBook             # that host's saved UI state
  #       url: http://127.0.0.1:8420 # as reached from the browser
  #     - id: jarvis
  #       label: Jarvis
  #       url: http://127.0.0.1:8421 # the tunnel above
  #       enabled: false             # keep the entry but stop offering the host
  hosts: []

logging:
  enabled: true
  level: info
  retention_days: 30
  # Empty means "<repo>/logs". Relative paths resolve against the repo root.
  log_dir: ""

storage:
  # Empty means "<repo>/data". MYHARNESS_WEB_DATA_DIR overrides this.
  data_dir: ""
  # Filename only, resolved inside data_dir. The .sqlite3 suffix is added when omitted.
  database_filename: myharness.sqlite3

ui:
  rich: auto
  verbose_tools: true
  # Display name for the app (window titles, splash screen, sidebar).
  app_name: "MyHarness"
  # Optional multi-line ASCII-art logo for the splash screen. The setup
  # installer generates one from the app name; leave empty for plain text.
  splash_ascii: ""
  # When true, the Workspace "Git" panel may stage and commit in the workspace repo.
  # Read-only status/diff is always available; writes stay disabled by default.
  git_writes_enabled: false

audio:
  enabled: false
  transcription:
    # local:  run faster-whisper on the FastAPI backend machine.
    # remote: upload browser audio directly to an SSH host configured below.
    # api:    POST the audio to an OpenAI-compatible /audio/transcriptions endpoint.
    processor: local
    # Remote mode only.
    server: ""
    username: ""
    key_file: ""
    # Remote mode uses {app_dir}/.venv/bin/python and stores requests under
    # {app_dir}/myharness/{session_id}/{voice_turn_id}/.
    app_dir: /opt/apps/whisperAudio
    # api mode only. Root of an OpenAI-compatible API, e.g. https://api.openai.com/v1
    # ("/audio/transcriptions" is appended).
    api_base_url: ""
    # Legacy fallback. Fresh installs use ~/.myharness/credentials.enc.
    api_key: ""
    # local/remote: a faster-whisper size (tiny/base/small/medium/large-v3).
    # api: the remote model id, e.g. whisper-1.
    model: small
    # Blank enables automatic language detection.
    language: ""
    # local/remote only: cpu | cuda | auto.
    device: cpu
    timeout_seconds: 1800
    max_upload_mb: 500

codex_app_server:
  enabled: false
  binary: codex
  listen: stdio://
  sandbox: workspace-write
  approval_policy: on-request
  timeout_seconds: 1800
  model: null
  reasoning_effort: low
  experimental_api: false

claude_agent:
  # Claude provider via the Claude Agent SDK (runs the local `claude` CLI).
  # Authentication uses your Claude Code login (subscription) or ANTHROPIC_API_KEY.
  enabled: false
  # Binary checked for availability (must be on PATH).
  binary: claude
  # Model override; null uses your Claude Code default.
  model: null
  # Permission mode override: default | acceptEdits | bypassPermissions | plan.
  # Empty derives it from the harness approval mode.
  permission_mode: ""
  timeout_seconds: 1800
  # 0 uses the SDK default (unlimited turns within a run).
  max_turns: 0

desktop:
  enabled: true
  backend_url: "http://127.0.0.1:8420"
  prefer_existing_backend: true
  start_local_backend_fallback: true
  electron_only: false
  allowed_frontend_origins: []
  # Disable Chromium hardware acceleration on Windows (workaround for locked-down
  # clients that crash on GPU process launch). Set to false to re-enable the GPU
  # and test rendering/startup performance.
  disable_gpu: true
